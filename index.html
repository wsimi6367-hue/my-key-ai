<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>My Key AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="app" id="app">

  <!-- Écran 1 : Recherche (formulaire) -->
  <section class="screen" id="screen-recherche" aria-label="Recherche">
    <div class="topbar">
      <button class="icon-btn" data-action="menu" aria-label="Menu" data-icon="menu"></button>
      <div class="segmented" role="tablist" aria-label="Type de transaction">
        <button data-tx="Vente" role="tab">Acheter</button>
        <button data-tx="Location" role="tab" class="on">Louer</button>
      </div>
      <button class="icon-btn" data-action="tts" aria-label="Lecture à voix haute" data-icon="speakerOff"></button>
    </div>
    <div class="scroll">
      <div class="logo" data-logo></div>
      <button class="card-btn" data-action="pick-place">
        <span data-icon="pin"></span>
        <span class="label">Choisir la commune / le quartier</span>
        <span class="value" id="place-value"></span>
      </button>
      <div class="chips" id="type-chips"></div>
      <textarea class="field" id="search-desc" placeholder="Décrivez le bien idéal (ex. duplex avec piscine, 3 chambres, budget 400 000)"></textarea>
      <button class="primary" data-action="search">Rechercher des biens</button>
      <div id="search-results"></div>
    </div>
  </section>

  <!-- Écran 2 : Assistant (chat) -->
  <section class="screen" id="screen-assistant" aria-label="Assistant">
    <div class="topbar">
      <button class="icon-btn" data-action="menu" aria-label="Menu" data-icon="menu"></button>
      <div class="assistant-pill">
        <span class="star" data-icon="star"></span>
        <span><strong>My Key AI</strong><small>Assistant IA</small></span>
      </div>
      <button class="icon-btn" data-action="tts" aria-label="Lecture à voix haute" data-icon="speakerOff"></button>
    </div>
    <div class="scroll" id="chat-scroll">
      <div class="hero" id="hero">
        <div class="logo" data-logo></div>
        <p>Bonjour, je suis My Key AI !</p>
        <h1>Comment puis-je vous aider à acheter ou louer aujourd'hui ?</h1>
      </div>
      <div class="chat" id="chat" aria-live="polite"></div>
    </div>
    <div class="chip-rows" id="suggestions"></div>
    <form class="composer" id="composer">
      <button type="button" class="ghost" data-action="goto-recherche" aria-label="Recherche détaillée" data-icon="plus"></button>
      <input id="chat-input" autocomplete="off" placeholder="Demandez un bien…" aria-label="Votre demande">
      <label class="ghost" aria-label="Envoyer une photo"><span data-icon="camera"></span><input type="file" accept="image/*" id="photo-input" hidden></label>
      <button type="button" class="mic-btn" data-action="goto-vocal" aria-label="Parler" id="mic-or-send" data-icon="mic"></button>
    </form>
  </section>

  <!-- Écran 3 : Vocal -->
  <section class="screen voice" id="screen-vocal" aria-label="Recherche vocale">
    <div class="topbar">
      <button class="icon-btn" data-action="goto-assistant" aria-label="Retour" data-icon="back"></button>
      <button class="icon-btn" data-action="menu" aria-label="Menu" data-icon="dots"></button>
    </div>
    <div class="logo" data-logo></div>
    <p class="hint">Dites « Montre-moi des studios à louer à Cocody » ou « villas à vendre à la Riviera ».</p>
    <div class="transcript" id="transcript"></div>
    <div class="status" id="voice-status"></div>
    <form class="fallback composer" id="voice-fallback">
      <input id="voice-text" placeholder="Le micro n'est pas disponible ici : tapez votre demande" aria-label="Votre demande">
      <button class="mic-btn" aria-label="Envoyer" data-icon="send"></button>
    </form>
    <div class="stage">
      <canvas id="wave"></canvas>
      <button class="big-mic" id="big-mic" aria-label="Commencer à parler" data-icon="mic"></button>
    </div>
    <div class="bottom">
      <button class="icon-btn" data-action="voice-stop" aria-label="Pause" data-icon="pause"></button>
      <button class="icon-btn" data-action="goto-assistant" aria-label="Fermer" data-icon="close"></button>
    </div>
  </section>

  <!-- Choix du lieu -->
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="place-sheet" role="dialog" aria-label="Choisir un lieu">
    <div class="grab"></div>
    <h2 id="sheet-title">Où cherchez-vous ?</h2>
    <input class="search" id="place-search" placeholder="Tapez un quartier : Faya, Angré, Zone 4…">
    <ul id="place-list"></ul>
  </div>

  <!-- Menu -->
  <nav class="drawer" id="drawer" aria-label="Menu">
    <div class="logo small" data-logo></div>
    <a href="#assistant" data-nav="assistant"><span data-icon="chat"></span>Assistant</a>
    <a href="#recherche" data-nav="recherche"><span data-icon="search"></span>Recherche détaillée</a>
    <a href="#vocal" data-nav="vocal"><span data-icon="mic"></span>Recherche vocale</a>
    <a href="#assistant" data-action="reset"><span data-icon="close"></span>Nouvelle conversation</a>
    <div class="meta" id="data-meta"></div>
  </nav>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
